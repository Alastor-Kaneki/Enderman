<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Signal Loom</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080910;color:#f0ecff;font:16px system-ui;text-align:center}main{max-width:550px;margin:auto;padding:32px 16px}h1{font-size:38px;letter-spacing:-2px;margin:8px 0}p{color:#a6a0ba}#board{display:grid;gap:6px;margin:25px auto;max-width:440px;aspect-ratio:1}button{border:1px solid #514369;background:#21192e;color:white;border-radius:14px;padding:12px 15px;font:inherit}button:active{background:#624384}.tile{padding:0;position:relative;background:#141522;border:1px solid #373044;border-radius:12px;touch-action:manipulation}.tile svg{width:100%;height:100%}.tile.powered{background:#282044;border-color:#a674ff}.tile.source{border-color:#f3d48b}.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#status{min-height:28px;color:#d8b6ff}small{color:#999}
</style></head><body><main><h1>Signal Loom</h1><p>Rotate the tiles. Connect every circuit to the golden source.</p><div class="bar"><button onclick="newGame()">New puzzle</button><button onclick="hint()">Hint</button><button onclick="undo()">Undo</button><button onclick="size=(size%3)+4;newGame()">Size: <span id="size">4</span>×<span id="size2">4</span></button></div><div id="board"></div><div id="status"></div><small id="moves"></small></main><script>
let size=4,tiles=[],history=[],count=0,solution=[],source=0;const N=1,E=2,S=4,W=8,dirs=[N,E,S,W],op=[S,W,N,E];const bit=(d)=>dirs[d];const rot=m=>((m<<1)&15)|((m>>3)&1);
function newGame(){let n=size*size;solution=Array(n).fill(0);let seen=new Set([0]),front=[0];while(front.length){let a=front.splice(Math.random()*front.length|0,1)[0];let x=a%size,y=Math.floor(a/size);let options=[[x,y-1,0],[x+1,y,1],[x,y+1,2],[x-1,y,3]].filter(([xx,yy])=>xx>=0&&yy>=0&&xx<size&&yy<size&&!seen.has(yy*size+xx));for(let [xx,yy,d] of options.sort(()=>Math.random()-.5)){let b=yy*size+xx;if(seen.has(b))continue;seen.add(b);front.push(b);solution[a]|=bit(d);solution[b]|=op[d]}}tiles=solution.map(m=>{let r=Math.random()*4|0;while(r--)m=rot(m);return m});history=[];count=0;document.getElementById('size').textContent=size;document.getElementById('size2').textContent=size;render()}
function powered(){let reached=new Set([source]),q=[source];while(q.length){let i=q.shift(),x=i%size,y=i/size;for(let d=0;d<4;d++){if(!(tiles[i]&bit(d)))continue;let xx=x+[0,1,0,-1][d],yy=y+[-1,0,1,0][d];if(xx<0||yy<0||xx>=size||yy>=size)continue;let j=yy*size+xx;if((tiles[j]&op[d])&&!reached.has(j)){reached.add(j);q.push(j)}}}return reached}
function render(){let p=powered(),board=document.getElementById('board');board.style.gridTemplateColumns='repeat('+size+',1fr)';board.replaceChildren();tiles.forEach((mask,i)=>{let b=document.createElement('button');b.className='tile'+(p.has(i)?' powered':'')+(i===source?' source':'');b.setAttribute('aria-label','Rotate circuit tile '+(i+1));let s='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="10" fill="'+(p.has(i)?'#d6b4ff':'#7e729c')+'"/>';for(let d=0;d<4;d++)if(mask&bit(d)){let x=[50,100,50,0][d],y=[0,50,100,50][d];s+='<path d="M50 50 L'+x+' '+y+'" stroke="'+(p.has(i)?'#ba8cff':'#746488')+'" stroke-width="12" stroke-linecap="round"/>'}s+='</svg>';b.innerHTML=s;b.onclick=()=>turn(i);board.appendChild(b)});document.getElementById('moves').textContent=count+' moves · '+p.size+'/'+tiles.length+' powered';document.getElementById('status').textContent=p.size===tiles.length?'Network complete! All signals connected.':'Restore the network'}
function turn(i){history.push(tiles.slice());tiles[i]=rot(tiles[i]);count++;render();if(navigator.vibrate)navigator.vibrate(12)}
function undo(){if(!history.length)return;tiles=history.pop();count=Math.max(0,count-1);render()}
function hint(){let candidates=tiles.map((m,i)=>i).filter(i=>tiles[i]!==solution[i]);if(!candidates.length)return;let i=candidates[Math.random()*candidates.length|0];turn(i)}
newGame();
</script></body></html>
