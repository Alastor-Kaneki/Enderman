name: Build Signal Loom APK
on:
  push:
    branches:
      - signal-loom-build-20261109
    paths:
      - 'signal-loom/**'
      - '.github/workflows/signal-loom-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble Android debug APK
        working-directory: signal-loom
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Signal-Loom-APK
          path: signal-loom/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
