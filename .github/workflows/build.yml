name: Build ModelBridge ARM64
on:
  push:
    branches: [modelbridge-bootstrap]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build native mod
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ModelBridge-ARM64-levipack
          path: dist/modelbridge.levipack
