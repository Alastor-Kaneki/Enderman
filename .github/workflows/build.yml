name: Build ModelBridge ARM64
on:
  push:
    branches: [modelbridge-bootstrap]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build native mod
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ModelBridge-ARM64-levipack
          path: dist/modelbridge.levipack
